<script>
/* ============================================================
   AUTOMATIC base-path detection - no manual configuration.
   On a GitHub Pages PROJECT page (username.github.io/repo/...),
   the repo name is always the first path segment right after the
   domain, whether at the root or a deep link (via 404.html) - so
   we read it straight from the current URL. Everywhere else
   (custom domain, Netlify, local Live Server, 127.0.0.1, etc.)
   the site is served from its own root, so BASE_PATH is empty.
   ============================================================ */
(function(){
  var base = '';
  if (location.hostname.endsWith('.github.io')) {
    var seg = location.pathname.split('/').filter(Boolean)[0];
    if (seg) base = '/' + seg;
  }
  window.BASE_PATH = base;
  document.write('<link rel="stylesheet" href="'+base+'/styles.css?v=16">');
})();
</script>
